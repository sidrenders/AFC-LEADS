<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>yeh open kar tanashvii 💜</title>
    <meta property="og:title" content="yeh open kar tanashvii 💜" />
    <meta property="og:description" content="I have something special for you... 💜" />
    <meta property="og:image" content="tanashvi.jpg" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="yeh open kar tanashvii 💜" />
    <meta name="twitter:description" content="I have something special for you... 💜" />
    <meta name="twitter:image" content="tanashvi.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #e6d7f1 0%, #c9a7e3 25%, #b892d4 50%, #d4b8e8 75%, #f0e4f7 100%);
            background-size: 400% 400%;
            animation: gradientShift 8s ease infinite;
            font-family: 'Quicksand', sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Background photo slideshow */
        .bg-slideshow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .bg-slideshow img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
        }

        .bg-slideshow img.active {
            opacity: 0.3;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Floating hearts background */
        .hearts-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .heart-float {
            position: absolute;
            font-size: 1.5rem;
            opacity: 0;
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            0% {
                opacity: 0;
                transform: translateY(100vh) rotate(0deg) scale(0.5);
            }
            10% {
                opacity: 0.6;
            }
            90% {
                opacity: 0.6;
            }
            100% {
                opacity: 0;
                transform: translateY(-10vh) rotate(360deg) scale(1.2);
            }
        }

        /* Sparkle particles */
        .sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
            animation: sparkle 2s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes sparkle {
            0%, 100% { opacity: 0; transform: scale(0); }
            50% { opacity: 1; transform: scale(1); }
        }

        .container {
            text-align: center;
            z-index: 10;
            padding: 2rem;
            max-width: 550px;
            width: 100%;
        }

        /* Main question text */
        .question {
            font-family: 'Dancing Script', cursive;
            font-size: 2.8rem;
            font-weight: 700;
            color: #4a1a6b;
            text-shadow: 0 2px 10px rgba(138, 79, 178, 0.3);
            margin-bottom: 2rem;
            opacity: 0;
            animation: fadeInDown 1.2s ease forwards 0.3s;
            line-height: 1.3;
        }

        .question .name {
            display: block;
            font-size: 3.2rem;
            background: linear-gradient(135deg, #7b2fa0, #c471ed, #7b2fa0);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 3s linear infinite;
        }

        @keyframes shimmer {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Image container with floating animation */
        .image-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 2.5rem;
            opacity: 0;
            animation: fadeIn 1s ease forwards 0.8s;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        .image-frame {
            width: 240px;
            height: 240px;
            border-radius: 50%;
            overflow: hidden;
            border: 5px solid rgba(255, 255, 255, 0.8);
            box-shadow:
                0 0 30px rgba(180, 130, 220, 0.5),
                0 0 60px rgba(180, 130, 220, 0.2),
                inset 0 0 20px rgba(255, 255, 255, 0.1);
            animation: floatImage 3s ease-in-out infinite;
            position: relative;
            margin: 0 auto;
        }

        .image-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        @keyframes floatImage {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-18px); }
        }

        /* Glowing ring around image */
        .glow-ring {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 260px;
            height: 260px;
            border-radius: 50%;
            border: 2px solid transparent;
            background: conic-gradient(from 0deg, transparent, #c471ed, #e8a0f0, transparent, #9b59b6, transparent) border-box;
            -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            animation: rotateRing 4s linear infinite;
        }

        @keyframes rotateRing {
            to { transform: translateX(-50%) rotate(360deg); }
        }

        /* Mini hearts orbiting the image */
        .orbit-heart {
            position: absolute;
            font-size: 1.2rem;
            animation: orbit 5s linear infinite;
            top: 50%;
            left: 50%;
        }

        .orbit-heart:nth-child(2) { animation-delay: -1.67s; }
        .orbit-heart:nth-child(3) { animation-delay: -3.33s; }

        @keyframes orbit {
            from { transform: rotate(0deg) translateX(150px) rotate(0deg); }
            to { transform: rotate(360deg) translateX(150px) rotate(-360deg); }
        }

        /* Buttons */
        .buttons {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            opacity: 0;
            animation: fadeInUp 1s ease forwards 1.4s;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .btn-yes {
            padding: 1rem 2.8rem;
            font-size: 1.2rem;
            font-family: 'Quicksand', sans-serif;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            letter-spacing: 0.5px;
        }

        .btn-yes:first-child {
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            color: white;
            box-shadow: 0 6px 25px rgba(142, 68, 173, 0.4);
        }

        .btn-yes:last-child {
            background: linear-gradient(135deg, #c471ed, #a855c9);
            color: white;
            box-shadow: 0 6px 25px rgba(196, 113, 237, 0.4);
        }

        .btn-yes:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 10px 35px rgba(142, 68, 173, 0.5);
        }

        .btn-yes:active {
            transform: translateY(0) scale(0.98);
        }

        /* Ripple effect on button */
        .btn-yes::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn-yes:active::after {
            width: 300px;
            height: 300px;
        }

        /* Celebration overlay */
        .celebration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(74, 26, 107, 0.6);
            backdrop-filter: blur(6px);
            flex-direction: column;
        }

        .celebration.active {
            display: flex;
            animation: fadeIn 0.5s ease;
        }

        .celebration-img {
            max-width: 85vw;
            max-height: 75vh;
            border-radius: 16px;
            box-shadow: 0 0 50px rgba(196, 113, 237, 0.6), 0 20px 60px rgba(0, 0, 0, 0.3);
            border: 4px solid rgba(255, 255, 255, 0.7);
            animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            object-fit: contain;
        }

        @keyframes popIn {
            0% { transform: scale(0.3); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .confetti-piece {
            position: fixed;
            width: 10px;
            height: 10px;
            top: -10px;
            z-index: 101;
            animation: confettiFall linear forwards;
        }

        @keyframes confettiFall {
            to {
                transform: translateY(110vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* Responsive */
        @media (max-width: 600px) {
            .question {
                font-size: 2rem;
            }
            .question .name {
                font-size: 2.4rem;
            }
            .image-frame {
                width: 180px;
                height: 180px;
            }
            .glow-ring {
                width: 200px;
                height: 200px;
            }
            .orbit-heart {
                animation-name: orbitSmall;
            }
            @keyframes orbitSmall {
                from { transform: rotate(0deg) translateX(115px) rotate(0deg); }
                to { transform: rotate(360deg) translateX(115px) rotate(-360deg); }
            }
            .btn-yes {
                padding: 0.85rem 2rem;
                font-size: 1.05rem;
            }
            .celebration-text {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>

    <!-- Background photo slideshow -->
    <div class="bg-slideshow" id="bgSlideshow"></div>

    <!-- Floating hearts background -->
    <div class="hearts-bg" id="heartsBg"></div>

    <div class="container">
        <h1 class="question">
            Will you be my Valentine,
            <span class="name">Tanashvi? 💜</span>
        </h1>

        <div class="image-wrapper">
            <div class="glow-ring"></div>
            <div class="image-frame">
                <img src="tanashvi.jpg" alt="My Love" />
            </div>
            <span class="orbit-heart">💜</span>
            <span class="orbit-heart">💗</span>
            <span class="orbit-heart">💜</span>
        </div>

        <div class="buttons">
            <button class="btn-yes" onclick="celebrate()">Yes 💜</button>
            <button class="btn-yes" onclick="celebrate()">Absolutely Yes 💗</button>
        </div>
    </div>

    <!-- Celebration overlay -->
    <div class="celebration" id="celebration">
        <img class="celebration-img" src="IMG_1500.jpg" alt="Us 💜" />
    </div>

    <script>
        // Create floating hearts
        function createFloatingHearts() {
            const container = document.getElementById('heartsBg');
            const hearts = ['💜', '💗', '💕', '🤍', '💜', '✨'];
            for (let i = 0; i < 20; i++) {
                const heart = document.createElement('span');
                heart.classList.add('heart-float');
                heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                heart.style.left = Math.random() * 100 + '%';
                heart.style.animationDuration = (6 + Math.random() * 6) + 's';
                heart.style.animationDelay = (Math.random() * 8) + 's';
                heart.style.fontSize = (1 + Math.random() * 1.5) + 'rem';
                container.appendChild(heart);
            }
        }

        // Create sparkles
        function createSparkles() {
            const body = document.body;
            for (let i = 0; i < 25; i++) {
                const sparkle = document.createElement('div');
                sparkle.classList.add('sparkle');
                sparkle.style.left = Math.random() * 100 + '%';
                sparkle.style.top = Math.random() * 100 + '%';
                sparkle.style.animationDelay = (Math.random() * 3) + 's';
                sparkle.style.animationDuration = (1.5 + Math.random() * 2) + 's';
                body.appendChild(sparkle);
            }
        }

        // Celebration with confetti
        function celebrate() {
            document.getElementById('celebration').classList.add('active');
            launchConfetti();
        }

        function launchConfetti() {
            const colors = ['#9b59b6', '#c471ed', '#e8a0f0', '#fff', '#f5d5f5', '#d4a0e8', '#ffc0e0', '#a855c9'];
            const shapes = ['circle', 'square'];
            for (let i = 0; i < 80; i++) {
                setTimeout(() => {
                    const piece = document.createElement('div');
                    piece.classList.add('confetti-piece');
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    const shape = shapes[Math.floor(Math.random() * shapes.length)];
                    piece.style.background = color;
                    piece.style.left = Math.random() * 100 + '%';
                    piece.style.borderRadius = shape === 'circle' ? '50%' : '2px';
                    piece.style.width = (6 + Math.random() * 10) + 'px';
                    piece.style.height = (6 + Math.random() * 10) + 'px';
                    piece.style.animationDuration = (2 + Math.random() * 3) + 's';
                    document.body.appendChild(piece);
                    setTimeout(() => piece.remove(), 5000);
                }, i * 30);
            }
        }

        // Background photo slideshow
        function createSlideshow() {
            const photos = [
                '2213d725-8c06-4d95-89aa-f0210dad61ce.jpg',
                '2978f9df-6fa4-4b71-b852-24aabcaa7c16.jpg',
                '4748db4d-7cf0-439a-a107-13276ae42103.JPG',
                'b96b89ee-0665-44fe-9326-5c95568264bc.JPG',
                'DSC01905.JPG',
                'DSC02122.JPG',
                'IMG_1137.JPG',
                'IMG_1179.JPG',
                'IMG_1202.JPG',
                'IMG_1518.jpg'
            ];
            const container = document.getElementById('bgSlideshow');
            // Shuffle array
            const shuffled = photos.sort(() => Math.random() - 0.5);
            shuffled.forEach(src => {
                const img = document.createElement('img');
                img.src = src;
                container.appendChild(img);
            });
            let current = 0;
            const images = container.querySelectorAll('img');
            images[0].classList.add('active');
            setInterval(() => {
                images[current].classList.remove('active');
                current = (current + 1) % images.length;
                images[current].classList.add('active');
            }, 4000);
        }

        createSlideshow();
        createFloatingHearts();
        createSparkles();
    </script>
</body>
</html>
